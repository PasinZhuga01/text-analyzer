<div class="text-editor">
    <textarea class="text-editor-input" #textarea [(ngModel)]="_value" placeholder="Введіть текст"></textarea>

    <div class="text-editor-footer">
        <div class="text-editor-stats">
            <span>Кількість символів: <b>{{ _symbolsCount() }}</b></span>
            <span>Кількість слів: <b>{{ _wordsCount() }}</b></span>
        </div>

        <button class="button" (click)="_copyValueToClipboard()">Копіювати текст</button>
    </div>
</div>
